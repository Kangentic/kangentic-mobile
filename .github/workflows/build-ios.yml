name: Build iOS

# Two independent paths, both on free unmetered macOS runners (standard runners
# are free on public repositories), and neither spends an EAS cloud build:
#
#   simulator - unsigned compile check. No Apple account, no certificates, no
#               secrets. Cheap enough to run on any change.
#   device    - signed .ipa for TestFlight and the App Store, archived and
#               exported with xcodebuild and uploaded straight to Apple.
#
# The device path exists for the same reason build-android.yml does: EAS Free
# gives 15 iOS cloud builds a month at concurrency 1 in a low-priority queue,
# which can mean hours of wait, and that allowance is Expo's to change. A
# GitHub runner has neither cap nor queue.
#
# It also removes Expo from the submission path entirely. `eas submit` uploads
# through Expo's own servers; the steps here talk to Apple directly, so an EAS
# Submit outage cannot block a release. See the iOS release section of
# docs/developer-guide.md.
#
# Dispatch only, deliberately. A native iOS build is 20 to 40 minutes, which is
# far too slow for a PR gate; ci.yml stays the gate.

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'simulator = unsigned compile check. device = signed .ipa.'
        type: choice
        default: simulator
        options:
          - simulator
          - device
          - both
      submit:
        description: 'Upload the signed .ipa to App Store Connect (device builds only).'
        type: choice
        default: none
        options:
          - none
          - testflight
      maestro:
        description: 'Run a Maestro flow against the simulator. EXPERIMENTAL, see the job comment.'
        type: choice
        default: none
        options:
          - none
          - smoke
      screenshots:
        description: 'Capture App Store screenshots on a 6.9-inch simulator. EXPERIMENTAL, see capture-ios-screenshots.sh.'
        type: choice
        default: 'false'
        options:
          - 'false'
          - 'true'
      crash_test:
        description: 'Reveal the crash-reporting test rows in Settings and drive them on the simulator so Sentry receives iOS events. For verifying delivery and what a crash report contains; never for a store submission.'
        type: boolean
        default: false
      nse_probe:
        description: 'Seed known probe keys into the shared Keychain from Settings and simctl-push a sealed envelope, to prove the Notification Service Extension decrypts on a simulator. Never for a store submission.'
        type: boolean
        default: false
  # Weekly drift detection. Nothing here is PR-triggered, so without a schedule the
  # only way to learn that a runner Xcode bump, a dependency update, or an Apple
  # toolchain change broke the iOS build is to want a release and discover it then.
  # Monday 06:00 UTC picks up whatever landed over the weekend.
  #
  # WEEKLY, not nightly, and that was considered. The drift this catches is
  # toolchain drift, and GitHub's runner images roll roughly weekly, so a nightly
  # cadence would spend seven 30-minute macOS jobs to observe the same change
  # once. Breakage from our OWN code has a different net: /pull-request dispatches
  # this workflow whenever a diff touches native inputs, so it is caught the same
  # day without the cron.
  #
  # Simulator only: see the job conditions below, which are written so a cron run
  # cannot fire a signed device build or an upload.
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: build-ios-${{ github.ref }}-${{ github.event.inputs.target || 'scheduled' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The SAME pin as e2e.yml, because this runs the SAME `.maestro/smoke.yaml`.
  # Two platforms on two Maestro versions means the next iOS-only flow failure
  # gets attributed to iOS when the variable that actually differed was the tool.
  # tests/unit/ciSafeMaestroFlows.test.ts asserts the two workflows agree, so
  # bumping means editing both plus .claude/rules/e2e-maestro-runs.md together.
  MAESTRO_VERSION: '2.7.0'
  MAESTRO_CLI_NO_ANALYTICS: '1'

jobs:
  # An unsigned iOS simulator build. Its purpose is not distribution: it proves
  # the native tree compiles at all, which for a long time was unverified here.
  # Kept as its own job rather than a matrix dimension of the signed build, so
  # the cheap always-available check cannot be taken down by a signing problem.
  simulator:
    name: Simulator (unsigned compile check)
    # `inputs` are all empty on a schedule, so the conditions must name the event
    # rather than lean on input defaults. Left implicit, `inputs.target != 'device'`
    # AND `inputs.target != 'simulator'` are BOTH true on a cron run, which would
    # quietly fire a signed device build every Monday.
    if: github.event_name == 'schedule' || inputs.target != 'device'
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      # Same shape as the device job's. Read ONLY by the crash-test probe
      # below: the plain compile check never touches a secret and uploads
      # nothing, and the export step's condition is what keeps it that way.
      HAS_SENTRY: ${{ secrets.SENTRY_AUTH_TOKEN != '' && vars.SENTRY_DSN != '' }}
      # `inputs` are all empty on the weekly cron, so the probe names the
      # event rather than leaning on an input default - the same trap as the
      # job's own `if:` above. A cron run must never crash-test anything.
      CRASH_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.crash_test == true }}
      NSE_PROBE: ${{ github.event_name == 'workflow_dispatch' && inputs.nse_probe == true }}

    steps:
      # iOS has no `plan` job, so the refusal build-android.yml puts there is
      # the first step of BOTH build jobs instead: at least one of them runs on
      # any dispatch, whatever `target` says, so the operator's intent is
      # checked before a runner minute is spent. A crash-test build reveals
      # Settings rows that crash the app and turns on the SDK's debug logging;
      # an NSE-probe build reveals rows that seed KNOWN push keys into the
      # Keychain. Neither must ever reach TestFlight. submit-testflight refuses
      # them too.
      - name: Refuse a probe build that is also a store submission
        if: (inputs.crash_test == true || inputs.nse_probe == true) && inputs.submit == 'testflight'
        run: |
          set -euo pipefail
          echo "::error::crash_test / nse_probe and submit=testflight are mutually exclusive. A probe build reveals Settings rows that crash the app or seed known Keychain keys, so it must never be uploaded to App Store Connect. Dispatch them as separate runs."
          exit 1

      # A screenshot run skips the `Launch the app on a simulator` step, which
      # is the only writer of `steps.smoke.outputs.device-id`, so the probe
      # flows would run against `maestro --device ""` and fail after the
      # 25-minute build - reading as iOS-driver flakiness rather than as a
      # dispatch that asked for two incompatible things.
      - name: Refuse a probe build combined with the screenshot capture
        if: (inputs.crash_test == true || inputs.nse_probe == true) && inputs.screenshots == 'true'
        run: |
          set -euo pipefail
          echo "::error::crash_test / nse_probe and screenshots=true are mutually exclusive: the screenshot capture boots its own simulator and skips the launch step the probes drive. Dispatch them as separate runs."
          exit 1

      - uses: actions/checkout@v7

      - name: Set up Node and dependencies
        uses: ./.github/actions/setup-node-deps

      # A crash-test build's whole purpose is a delivered event. Without a DSN
      # it would spend 25 minutes building an app that reports nowhere, and the
      # device job's `::notice::` for the same condition is not loud enough for
      # a run that exists only to be read back from Sentry.
      - name: Refuse a crash test without Sentry configured
        if: env.CRASH_TEST == 'true' && env.HAS_SENTRY != 'true'
        run: |
          set -euo pipefail
          echo "::error::crash_test needs both the SENTRY_AUTH_TOKEN secret and the SENTRY_DSN variable, or the build reports nowhere and uploads no symbols. See the crash reporting section of docs/developer-guide.md."
          exit 1

      # The device job's export, gated on the PROBE rather than on HAS_SENTRY
      # alone, so a default dispatch and the weekly cron stay secret-free and
      # upload no symbols. Same pre-prebuild requirement: app.config.ts reads
      # SENTRY_AUTH_TOKEN at config-evaluation time to decide whether to add
      # the Sentry plugin (the Xcode phases that upload source maps and dSYMs),
      # and the DSN is inlined into the bundle by the build phase prebuild sets
      # up. Exported late, the crash arrives unsymbolicated or not at all, with
      # every step green.
      - name: Export the Sentry build env
        if: env.CRASH_TEST == 'true' && env.HAS_SENTRY == 'true'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_DSN: ${{ vars.SENTRY_DSN }}
        run: |
          set -euo pipefail
          echo "::add-mask::$SENTRY_AUTH_TOKEN"
          {
            echo "SENTRY_AUTH_TOKEN=$SENTRY_AUTH_TOKEN"
            echo "EXPO_PUBLIC_SENTRY_DSN=$SENTRY_DSN"
          } >> "$GITHUB_ENV"
          echo "Sentry is enabled for this crash-test build: dSYMs and source maps upload, crash reporting is active."
          echo "Reporting to: $SENTRY_DSN"

      # Mirrors build-android.yml's step of the same name. EXPO_PUBLIC_* is
      # inlined at bundle time, so this too must precede prebuild; exported
      # late, Settings never reveals the rows and the flows time out scrolling
      # for a testID that does not exist.
      - name: Export the crash-test flag
        if: env.CRASH_TEST == 'true'
        run: |
          set -euo pipefail
          echo "EXPO_PUBLIC_KANGENTIC_CRASHTEST=1" >> "$GITHUB_ENV"
          echo "::notice::Crash-test rows are enabled in Settings for this build, and it reports to the crash-test Sentry environment. It is a probe, not a distribution artifact."

      # Both values are inlined at bundle time, so this precedes prebuild too.
      #
      # The Keychain group carries Xcode's PLACEHOLDER team prefix. A shipped
      # build's group is `<TeamID>.com.kangentic.mobile.shared`, composed in
      # the device job from the provisioning profile, because kSecAttrAccessGroup
      # needs the team-prefixed literal and the team id must not be committed.
      # An ad-hoc simulator build has no team, and the first guess here was
      # that `$(AppIdentifierPrefix)` would therefore expand to nothing. It
      # does not: run 34674085719's entitlement check read
      # `application-identifier = FAKETEAMID.com.kangentic.mobile.nse` and
      # `keychain-access-groups = (FAKETEAMID.com.kangentic.mobile.shared)`
      # out of the signed bundles, so `FAKETEAMID.` is what Xcode substitutes
      # for the prefix when no team is set. `FAKETEAMID` is Xcode's own
      # constant, not anyone's identity. The step after the crash flows keeps
      # asserting the bundles agree with this literal.
      - name: Export the NSE probe env
        if: env.NSE_PROBE == 'true'
        run: |
          set -euo pipefail
          {
            echo "EXPO_PUBLIC_KANGENTIC_NSE_PROBE=1"
            echo "EXPO_PUBLIC_KANGENTIC_IOS_KEYCHAIN_GROUP=FAKETEAMID.com.kangentic.mobile.shared"
          } >> "$GITHUB_ENV"
          echo "::notice::NSE probe rows are enabled in Settings for this build, and its push key writes target the FAKETEAMID-prefixed shared Keychain group an ad-hoc simulator build carries. It is a probe, not a distribution artifact."

      - name: Generate the native iOS project
        # CNG: ios/ is produced here and never committed. See
        # .claude/rules/expo-cng.md. --no-install because setup-node-deps
        # already installed; it also skips CocoaPods, which the next step runs.
        run: npx expo prebuild --platform ios --no-install

      # DO NOT ADD A CocoaPods CACHE HERE, even though the `device` job has one
      # and the asymmetry looks like an oversight. It was measured on 2026-07-30
      # and it is the wrong trade.
      #
      # The ceiling is the whole step, and the whole step is 60 SECONDS
      # (run 30464295817, 15:08:01 to 15:09:01). The device job's comment calls
      # pod install "minutes of downloads", which is what makes this look
      # worthwhile - it is not minutes here.
      #
      # Against that, an ios/Pods entry is hundreds of MB to GB, and the Actions
      # cache is 10 GB PER REPOSITORY with eviction by last access across every
      # ref. It measured 9.86 GB the day this was written. So the entry would be
      # paid for by evicting the Gradle cache that `Build (APK)` in e2e.yml
      # depends on - a job that IS on the merge path, where a cache miss costs
      # minutes (147 of 1029 tasks from cache, 14m 53s, against 415 of 1055 and
      # ~8m healthy). Trading minutes off the Android gate to save under a
      # minute on a dispatch-only iOS job is backwards.
      #
      # Worth knowing before reversing this: the device job's Pods cache was NOT
      # in `gh cache list` at all when this was measured. It had already been
      # evicted, so it was costing budget and returning nothing.
      #
      # Revisit only if the cache budget has real headroom AND pod install has
      # grown well past a minute. See .github/workflows/cache-cleanup.yml.
      - name: Install pods
        # The .xcworkspace is a CocoaPods artifact, so it does not exist until
        # this step completes. Everything that reads the workspace comes after.
        working-directory: ios
        run: pod install

      - name: Resolve the workspace and scheme
        id: xcode
        run: bash .github/scripts/resolve-ios-scheme.sh

      # Only a probe needs this. It prints the release string the delivered
      # events will carry (`com.kangentic.mobile@<version>+<buildNumber>`),
      # which is how the desk-side verification in docs/developer-guide.md
      # finds them - and it is the SAME string as the shipped build cut from
      # this version, which is why the events are tagged `environment:
      # crash-test` rather than `production`.
      - name: Read the app version
        id: version
        if: env.CRASH_TEST == 'true'
        run: |
          set -euo pipefail
          npx expo config --json > "$RUNNER_TEMP/expo-config.json"
          read_config_field() {
            node -e "const c=JSON.parse(require('node:fs').readFileSync(process.argv[1],'utf8'));process.stdout.write(String($1))" "$RUNNER_TEMP/expo-config.json"
          }
          echo "version-name=$(read_config_field 'c.version')" >> "$GITHUB_OUTPUT"
          echo "build-number=$(read_config_field 'c.ios.buildNumber')" >> "$GITHUB_OUTPUT"

      - name: Build for the simulator
        env:
          WORKSPACE: ${{ steps.xcode.outputs.workspace }}
          SCHEME: ${{ steps.xcode.outputs.scheme }}
          # Store-screenshot mode only. The mock desktop is gated on
          # `__DEV__ && EXPO_PUBLIC_KANGENTIC_MOCK === '1'`, so a Release build
          # shows an unpaired empty state with nothing worth capturing.
          #
          # DEBUG CONFIGURATION IS THE LOAD-BEARING PART, and it was learned the
          # hard way. Passing DEV=true to a Release build does nothing: React
          # Native's bundling script derives --dev from $CONFIGURATION and
          # OVERWRITES any inherited DEV, so the first probe bundled with
          # `--dev false` and captured a "No desktop paired" screen at exactly
          # the right resolution.
          #
          # FORCE_BUNDLING is what keeps a Debug build self-contained: without
          # it a Debug app expects a Metro server the runner is not running, and
          # with it the dev bundle is embedded in the .app. So: Debug for
          # __DEV__, FORCE_BUNDLING for no-Metro, and the guard in source is
          # left alone.
          FORCE_BUNDLING: ${{ inputs.screenshots == 'true' && '1' || '' }}
          EXPO_PUBLIC_KANGENTIC_MOCK: ${{ inputs.screenshots == 'true' && '1' || '' }}
          BUILD_CONFIGURATION: ${{ inputs.screenshots == 'true' && 'Debug' || 'Release' }}
          SIGN_AD_HOC: ${{ (inputs.screenshots == 'true' || inputs.crash_test == true || inputs.nse_probe == true) && '1' || '' }}
        run: |
          set -euo pipefail

          # AD-HOC SIGN THE SCREENSHOT BUILD AND THE CRASH-TEST PROBE, and only
          # those.
          #
          # An unsigned app has no entitlements at all, including
          # `application-identifier` - and without it every keychain call fails
          # with errSecMissingEntitlement. That is not hypothetical here:
          # expo-secure-store threw "A required entitlement isn't present" on
          # boot, expo-notifications followed with ERR_NOTIFICATIONS_KEYCHAIN_ACCESS,
          # and LogBox put a red banner across the capture.
          #
          # Ad-hoc signing (identity "-") needs no Apple account, no certificate
          # and no provisioning profile, so it costs the runner nothing. It also
          # turns the capture into the first real exercise of iOS keychain
          # access, which matters well beyond screenshots: the pairing trust
          # anchor lives in expo-secure-store.
          #
          # The crash-test probe needs it for a different reason: those same
          # keychain rejections are unhandled promise rejections at boot, and
          # the Sentry SDK tracks Hermes promise rejections, so an unsigned
          # probe would report entitlement noise into the very run that exists
          # to deliver two clean, deliberate crashes. The probe stays on the
          # RELEASE configuration, deliberately: a JS throw is fatal only in
          # Release, the bundle is embedded, and the dSYM phase does not skip
          # it. The NSE probe needs it most of all: keychain sharing between
          # the app and its extension is an ENTITLEMENT, and an unsigned bundle
          # has none.
          #
          # The plain compile check stays UNSIGNED. It exists to be runnable by
          # anyone with no Apple setup whatsoever, and nothing about it needs the
          # keychain.
          if [ "${SIGN_AD_HOC:-}" = "1" ]; then
            signing_args=(CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=-)
          else
            signing_args=(CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO)
          fi

          # EXCLUDED_ARCHS=x86_64 is the difference between compiling this app
          # once and compiling it twice.
          #
          # `generic/platform=iOS Simulator` resolves ARCHS to ARCHS_STANDARD,
          # which for the simulator SDK is `arm64 x86_64`. macos-latest runners
          # are arm64 (see the node-cache-macOS-arm64-npm cache key), and the
          # simulator the steps below boot is therefore arm64 too, so every
          # x86_64 object compiled here is thrown away. MEASURED on run
          # 30464295817: 4664 `Objects-normal/x86_64/` outputs against 5335
          # arm64, all of them under Pods.build, in a step that took 21m 07s of
          # a 31m 11s job.
          #
          # The APP target already carries exactly this setting, inherited from
          # the generated project - 6 build-phase environment dumps show
          # `EXCLUDED_ARCHS= x86_64`. It is the ~100 POD targets that did not,
          # and a command-line build setting is what reaches them.
          #
          # EXCLUDED_ARCHS rather than ARCHS=arm64, for two reasons. It is the
          # setting the app target already builds with. And Apple documents that
          # if the resulting architecture list is empty "the target will not
          # produce a binary" - so on a hypothetical x86_64 runner this fails at
          # the `Verify an app bundle was produced` step below, which exists for
          # precisely this class of silent failure, instead of quietly building
          # an arm64 slice that no simulator on that runner can launch.
          #
          # ONLY_ACTIVE_ARCH is NOT the knob here: Apple documents it as ignored
          # when the destination does not name a specific architecture, which a
          # generic destination does not. The generic destination stays, because
          # a concrete `-destination ...,name=iPhone 16` couples this job to a
          # device name that the runner image is free to change.
          #
          # RESULT, one run per arm (30464295817 before, 30517573207 after):
          #
          #   Build for the simulator   21m 07s -> 14m 03s   (-7m 28s)
          #   whole job                 31m 11s -> 24m 40s   (-6m 31s)
          #   Objects-normal/x86_64        4664 -> 1
          #   Objects-normal/arm64         5335 -> 5247
          #
          # n=1 each, which is normally not enough to claim anything on this
          # workflow - but the mechanism is verified directly rather than
          # inferred from the clock: the x86_64 object files are simply gone
          # while the arm64 ones are not, and `Launch the app on a simulator`
          # still passed, so the thinner binary really does run.
          #
          # Compare that with the Android gate, where a control run measured
          # 5m 38s faster than a CONFIGURATION-IDENTICAL baseline purely on cache
          # health. A clock difference on its own proves very little here.
          xcodebuild build \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration "$BUILD_CONFIGURATION" \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            EXCLUDED_ARCHS=x86_64 \
            "${signing_args[@]}"

      # xcodebuild exits 0 for a build that compiled nothing we care about, so
      # the exit code is not proof. The app bundle existing is. This is not
      # hypothetical: the first version of this job "succeeded" in three minutes
      # while building a CocoaPods scheme and no app code at all.
      - name: Verify an app bundle was produced
        id: verify
        env:
          SCHEME: ${{ steps.xcode.outputs.scheme }}
          # Must track the build step's configuration, or the screenshot run
          # looks for a Release product that was never built.
          BUILD_CONFIGURATION: ${{ inputs.screenshots == 'true' && 'Debug' || 'Release' }}
        run: |
          set -euo pipefail
          app_path="$RUNNER_TEMP/DerivedData/Build/Products/$BUILD_CONFIGURATION-iphonesimulator/$SCHEME.app"
          if [ ! -d "$app_path" ]; then
            echo "::error::No $SCHEME.app was produced. The build compiled something, but not the app."
            ls -R "$RUNNER_TEMP/DerivedData/Build/Products" || true
            exit 1
          fi
          if [ ! -f "$app_path/$SCHEME" ]; then
            echo "::error::$SCHEME.app contains no executable."
            exit 1
          fi
          echo "Produced $SCHEME.app ($(du -sh "$app_path" | cut -f1))."

          # The Notification Service Extension compiles as its own target and
          # is EMBEDDED by a copy phase; a green build proves the first and not
          # the second. An app whose PlugIns/ holds no extension installs,
          # launches and renders every push as the generic placeholder, which
          # is exactly the failure docs/developer-guide.md says a delivered
          # notification cannot distinguish from the extension never running.
          appex_executable="$app_path/PlugIns/KangenticNSE.appex/KangenticNSE"
          if [ ! -f "$appex_executable" ]; then
            echo "::error::$SCHEME.app carries no PlugIns/KangenticNSE.appex executable. The extension compiled but was not embedded, so no push could ever be decrypted on this build."
            ls -R "$app_path/PlugIns" 2>/dev/null || echo "(no PlugIns directory at all)"
            exit 1
          fi
          echo "Embedded PlugIns/KangenticNSE.appex."

          # For the crash-test probe only: the Sentry debug-files phase uploads
          # whatever dSYM the build emitted, and with none the native crash
          # arrives as bare addresses while every step stays green. The device
          # job asserts the same thing from the build settings; here the
          # product itself is the proof.
          if [ "${CRASH_TEST:-}" = "true" ]; then
            dsym_path="$RUNNER_TEMP/DerivedData/Build/Products/$BUILD_CONFIGURATION-iphonesimulator/$SCHEME.app.dSYM"
            if [ ! -d "$dsym_path" ]; then
              echo "::error::No $SCHEME.app.dSYM beside the app, so the Sentry debug-files phase had nothing to upload and the native crash will arrive unsymbolicated."
              ls "$RUNNER_TEMP/DerivedData/Build/Products/$BUILD_CONFIGURATION-iphonesimulator" || true
              exit 1
            fi
            echo "Produced $SCHEME.app.dSYM for the Sentry upload phase."
          fi
          echo "app-path=$app_path" >> "$GITHUB_OUTPUT"

      # Compiling is not running. Until this step existed the iOS app had never
      # been launched anywhere, so a missing Info.plist key, a native module that
      # throws in its constructor, or a JS bundle that dies on first render would
      # all have passed the build unnoticed.
      - name: Launch the app on a simulator
        id: smoke
        # Skipped for a screenshot run, and that is worth 12 minutes.
        #
        # This step boots its OWN simulator, and `pickIosSimulator` without a
        # preference returns whatever iPhone simctl lists first - while the
        # capture step below insists on a 6.9-inch Pro Max for the App Store
        # shelf. So a screenshot run was booting two different simulators back
        # to back, at roughly six minutes each, to prove the same thing twice.
        # The capture asserts the process survives and produces a screenshot of
        # a rendered app, which is strictly more than this step checks.
        if: inputs.screenshots != 'true'
        env:
          APP_PATH: ${{ steps.verify.outputs.app-path }}
          # Keeps the simulator up for the Maestro steps below (the smoke flow
          # and the crash-test probe), which drive the same one. Booting a
          # simulator takes over a minute.
          KEEP_SIMULATOR_BOOTED: ${{ (inputs.maestro != 'none' || inputs.crash_test == true || inputs.nse_probe == true) && '1' || '' }}
        run: bash .github/scripts/smoke-ios-simulator.sh "$APP_PATH" com.kangentic.mobile "$RUNNER_TEMP/launch.png"

      # App Store listing screenshots. EXPERIMENTAL and opt-in: see the header of
      # capture-ios-screenshots.sh for the __DEV__/bundling question this run
      # exists to answer. Android's shelves are captured locally by
      # scripts/storeScreenshots.mjs, but iOS needs a booted simulator, so it can
      # only happen here.
      # Metro has to run for the screenshot capture, and it has to carry the mock
      # flag ITSELF: EXPO_PUBLIC_* variables are inlined into the bundle at
      # bundle time, so setting it only on xcodebuild leaves the served bundle
      # without it. A Debug build asks the dev client where to load from, and
      # this is the answer.
      - name: Start Metro for the screenshot capture
        if: inputs.screenshots == 'true'
        env:
          EXPO_PUBLIC_KANGENTIC_MOCK: '1'
          # Silences LogBox for this bundle only. An unsigned simulator build
          # has no keychain entitlement, so expo-secure-store throws on boot and
          # LogBox puts a red banner across the bottom of every frame.
          EXPO_PUBLIC_KANGENTIC_SHOTS: '1'
        run: |
          set -euo pipefail
          nohup npx expo start --dev-client --port 8081 > "$RUNNER_TEMP/metro.log" 2>&1 &
          # Poll Metro's own status endpoint rather than sleeping a guessed
          # duration: a cold bundler start is minutes on a fresh runner, and a
          # capture that races it screenshots a loading screen.
          for attempt in $(seq 1 60); do
            if curl -sf http://localhost:8081/status | grep -q 'packager-status:running'; then
              echo "Metro is up after ${attempt} attempts."
              exit 0
            fi
            sleep 5
          done
          echo "::error::Metro never reported packager-status:running."
          cat "$RUNNER_TEMP/metro.log" || true
          exit 1

      - name: Capture App Store screenshots
        if: inputs.screenshots == 'true'
        env:
          APP_PATH: ${{ steps.verify.outputs.app-path }}
          METRO_URL: http://localhost:8081
          # Read, not just uploaded: the capture waits for Metro to actually
          # serve a bundle before screenshotting.
          METRO_LOG: ${{ runner.temp }}/metro.log
          # The Maestro step below drives this same simulator, and the
          # status-bar override would be lost with a shutdown.
          KEEP_SIMULATOR_BOOTED: '1'
        # Its own directory, deliberately NOT the one the store set is collected
        # into: this step produces a diagnostic launch frame, and mixing it in
        # with the listing images is how an un-navigated screenshot shipped as
        # the feed shot. See the comment on capture_path in that script.
        run: bash .github/scripts/capture-ios-screenshots.sh "$APP_PATH" com.kangentic.mobile "$RUNNER_TEMP/ios-launch-check"

      # The App Store wants a MINIMUM OF THREE screenshots per shelf, and the
      # step above deliberately produces exactly one: it needs no UI driver, so
      # it always works and is the floor.
      #
      # The rest need navigation, which needs a driver. Maestro's iOS driver
      # depends on Facebook's idb_companion and has an open upstream break on
      # recent macOS/Xcode pairings (mobile-dev-inc/Maestro#2906), so this is
      # attempted rather than relied on - `continue-on-error` keeps a driver
      # failure from throwing away the frame we already have.
      #
      # It runs the SAME flow as Android. Every selector in it is a testID,
      # which maps to accessibilityIdentifier on iOS, so if the driver works the
      # whole six-shot set comes for free rather than needing an iOS-specific
      # flow to maintain alongside it.
      - name: Install Maestro for the screenshot flow
        if: inputs.screenshots == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          brew tap facebook/fb
          # Homebrew refuses to load a formula from a third-party tap until the
          # tap is explicitly trusted, and says so rather than installing:
          # "Refusing to load formula facebook/fb/idb-companion from untrusted
          # tap". Without this the install dies, Maestro has no iOS driver, and
          # the failure looks like the known upstream driver breakage rather
          # than a missing opt-in.
          brew trust facebook/fb
          brew install idb-companion
          curl -Ls https://get.maestro.mobile.dev > "$RUNNER_TEMP/install-maestro.sh"
          bash "$RUNNER_TEMP/install-maestro.sh"
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Capture the remaining screenshots with Maestro
        id: ios-maestro
        if: inputs.screenshots == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          maestro --device "$(xcrun simctl list devices booted -j | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);for(const runtime of Object.values(j.devices))for(const device of runtime)if(device.state==="Booted")return process.stdout.write(device.udid)})')" \
            test \
            --debug-output "$RUNNER_TEMP/maestro-ios" \
            -e OUTPUT_DIR=shots \
            .maestro/screenshots/store-capture.yaml \
            || echo "::warning::The capture flow did not run to completion. Collecting whatever it captured before stopping."
          # ALWAYS collect, even from a failed run.
          #
          # `set -e` plus a non-zero maestro exit skipped these lines entirely,
          # which is how a run that captured four good frames handed back none:
          # the flow died at the end and took the collection with it. A partial
          # set is worth having - the App Store needs three, and a late failure
          # can still have produced them.
          #
          # Maestro re-roots takeScreenshot paths under its own run directory,
          # exactly as it does on Android.
          #
          # MATCH THE takeScreenshot DIRECTORY EXACTLY. The earlier `-path
          # '*shots*'` also matched Maestro's own `screenshots/` folder, which
          # holds a frame per failed step, so a debug capture named
          # `step-029-assertCondition-...png` was collected as though it were a
          # listing image. Substring globs are too loose for a directory that
          # sits beside one with a superset name.
          mkdir -p "$RUNNER_TEMP/ios-screenshots"
          find "$RUNNER_TEMP/maestro-ios" -name '*.png' -path '*/takeScreenshot/shots/*' \
            -exec cp {} "$RUNNER_TEMP/ios-screenshots/" \; || true
          ls -la "$RUNNER_TEMP/ios-screenshots"

      # SAY SO WHEN THE DRIVER PRODUCED NOTHING.
      #
      # The step above is continue-on-error so a broken iOS driver cannot throw
      # away the frame the scripted capture already took. That protection cost
      # two runs: it reported success while doing nothing at all - once because
      # Homebrew refused an untrusted tap, once for another reason entirely -
      # and the green tick hid both. A step that can silently no-op is worse
      # than one that fails, so the count is checked and surfaced explicitly.
      #
      # A warning rather than a failure, because one verified frame is still a
      # real result and worth keeping.
      - name: Report how many screenshots were captured
        if: inputs.screenshots == 'true'
        run: |
          set -euo pipefail
          count="$(find "$RUNNER_TEMP/ios-screenshots" -name '*.png' | wc -l | tr -d ' ')"
          echo "Captured $count screenshot(s)."

          # CHECK THE NAMES, NOT JUST THE COUNT.
          #
          # A count alone called a run successful when one of its "screenshots"
          # was a Maestro failure frame and another was an un-navigated launch
          # capture. Both were real PNGs at the right size, so every check in
          # place at the time passed. Android gets this for free from
          # verifyCaptures(); this is the same guard for the shelf that has no
          # local rig. SHOT_NAMES is read from the script so there is one list.
          expected="$(node -e 'import("./scripts/storeScreenshots.mjs").then(m=>console.log(m.SHOT_NAMES.join("\n")))')"
          for png in "$RUNNER_TEMP/ios-screenshots"/*.png; do
            [ -e "$png" ] || continue
            name="$(basename "$png" .png)"
            if ! echo "$expected" | grep -qx "$name"; then
              echo "::warning::$name.png is not one of the expected store shots. Something other than the capture flow wrote into the output directory."
            fi
          done

          # NAME WHAT IS MISSING. The capture flow now SKIPS a page it cannot
          # reach rather than aborting the run, so that one bad navigation
          # cannot also cost every frame after it. That is the right trade only
          # if a skip is loud: otherwise a short set reads as "the flow ran"
          # and nobody learns which screen stopped working.
          while read -r name; do
            [ -n "$name" ] || continue
            if [ ! -f "$RUNNER_TEMP/ios-screenshots/$name.png" ]; then
              echo "::warning::$name.png was never captured. That page was not reached - read the ios-screenshot-maestro artifact's failure screenshot."
              echo "- Missing: \`$name.png\`" >> "$GITHUB_STEP_SUMMARY"
            fi
          done <<< "$expected"
          {
            echo "### iOS store screenshots"
            echo ""
            echo "Captured **$count** at 1320x2868 (App Store 6.9-inch shelf)."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$count" -lt 3 ]; then
            echo "::warning::Only $count screenshot(s). The App Store needs at least 3 per shelf, so the Maestro pass did not add its frames - check the ios-screenshot-maestro artifact."
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Below the App Store minimum of 3. The Maestro pass added nothing." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the Maestro iOS output
        if: ${{ inputs.screenshots == 'true' && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-screenshot-maestro-${{ github.sha }}
          path: ${{ runner.temp }}/maestro-ios
          retention-days: 14
          if-no-files-found: warn
          # Maestro writes its run under a DOT directory (.maestro/tests/...),
          # and upload-artifact skips hidden files by default - so this artifact
          # uploaded empty and the failure screenshot, which is the first thing
          # worth reading when a flow stops, was unreachable.
          include-hidden-files: true

      # Metro's log is the first thing worth reading when the capture shows a
      # loading screen or a red box: it names the failing module directly, which
      # a screenshot cannot. The launch-check frame rides along: it is not a
      # listing image (see capture-ios-screenshots.sh), but when the flow fails
      # on its first assertion it answers "did the app even render?" outright.
      - name: Upload the Metro log
        if: ${{ inputs.screenshots == 'true' && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-screenshot-metro-log-${{ github.sha }}
          path: |
            ${{ runner.temp }}/metro.log
            ${{ runner.temp }}/ios-launch-check
          retention-days: 14
          if-no-files-found: warn

      - name: Upload the App Store screenshots
        if: ${{ inputs.screenshots == 'true' && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-store-screenshots-${{ github.sha }}
          path: ${{ runner.temp }}/ios-screenshots
          retention-days: 14
          if-no-files-found: warn

      # EXPERIMENTAL, and opt-in for a reason. Maestro's iOS driver needs Facebook's
      # idb_companion, and there is an open upstream issue where a recent
      # macOS + Xcode pairing breaks its simulator connection entirely
      # (mobile-dev-inc/Maestro#2906). This runner is on Xcode 26.5, so it may
      # simply not work.
      #
      # Gated behind an input rather than folded into the default path: the launch
      # smoke above is now a proven, reliable signal, and an experiment with a known
      # upstream failure mode must not be able to take it down. Promote this to
      # default only once it has been green repeatedly.
      #
      # Worth knowing what this can and cannot reach. `.maestro/smoke.yaml` runs
      # against a fresh unpaired install, so it exercises real UI interaction on iOS
      # (tap handling, tab navigation, empty states) but NOT the terminal. The
      # terminal needs a paired session, which needs the stub desktop peer and the
      # `usesCleartextTraffic` carve-out that is still unlanded.
      - name: Install Maestro and its iOS driver
        # Both probes drive their flows with the same driver.
        if: inputs.maestro != 'none' || inputs.crash_test == true || inputs.nse_probe == true
        run: |
          set -euo pipefail
          brew tap facebook/fb
          # See the screenshot job's copy of this: Homebrew will not load a
          # third-party tap's formula until the tap is trusted, so without this
          # the driver silently never installs.
          brew trust facebook/fb
          brew install facebook/fb/idb-companion
          # Installs the pinned MAESTRO_VERSION from the workflow-level `env:`.
          curl -Ls 'https://get.maestro.mobile.dev' | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run the Maestro smoke flow
        # Both halves of this condition are required. `device-id` is written only
        # by the `smoke` step, which a screenshot run skips - so dispatching
        # `-f screenshots=true -f maestro=smoke` (nothing validates the pair)
        # would leave this reading an empty output and running
        # `maestro --device "" ...`, failing the job after the captures already
        # succeeded, for a reason that reads as iOS-driver flakiness.
        if: inputs.maestro != 'none' && inputs.screenshots != 'true'
        env:
          MAESTRO_DEVICE: ${{ steps.smoke.outputs.device-id }}
        run: |
          set -euo pipefail
          maestro --version
          maestro --device "$MAESTRO_DEVICE" test .maestro/smoke.yaml \
            --format JUNIT \
            --output "$RUNNER_TEMP/maestro-ios-report.xml" \
            --debug-output "$RUNNER_TEMP/maestro-ios-debug" \
            --flatten-debug-output

      # THE iOS CRASH-TEST PROBE. Until this existed the Sentry `mobile`
      # project had never received an event from any iOS build (task #67), and
      # nothing short of a delivered event tells "iOS is stable" apart from
      # "iOS reporting is dead". Two deliberate crashes, each followed by a
      # relaunch, because sentry-cocoa stores a fatal event's envelope on disk
      # and sends it on the NEXT launch (RNSentry.mm's storeEnvelope for
      # hardCrashed) - and that is as true of the JS throw as of the native
      # crash: the JS handler flushes for two seconds and then hands to the
      # default handler, which aborts. A probe that taps and never relaunches
      # proves the crash happened and delivers nothing.
      #
      # Maestro's exit code is a WARNING here, not the verdict. The iOS driver
      # may lose the app the instant it dies after the tap and call that a
      # flow failure; the crash report in ~/Library/Logs/DiagnosticReports is
      # what says the tap landed, so that is what this step asserts on.
      #
      # Maestro has no sleep primitive, which is why the relaunch and the
      # upload wait live here rather than in the flows. Sentry.init runs at
      # bundle entry (index.js), so the outbox starts flushing as soon as the
      # process is up; 25 s covers a cold runner's DNS and TLS with margin.
      #
      # Expect exactly ONE Sentry event per crash: RNSentry.mm installs a
      # native beforeSend that drops the "Unhandled JS Exception" twin of the
      # JS throw, the same dedup sentry-android does with JavascriptException.
      - name: Run the crash-test flows
        if: env.CRASH_TEST == 'true'
        timeout-minutes: 20
        env:
          MAESTRO_DEVICE: ${{ steps.smoke.outputs.device-id }}
          EVIDENCE: ${{ runner.temp }}/crash-evidence
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          # BSD find has no reliable "@epoch" form; a marker file is the
          # portable "newer than the start of this step".
          touch "$EVIDENCE/run-start.marker"

          crash_reports() {
            find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 1 -name '*.ips' -newer "$EVIDENCE/run-start.marker" -print0 2>/dev/null \
              | xargs -0 grep -l 'com.kangentic.mobile' 2>/dev/null || true
          }
          app_is_running() {
            # Capture THEN match. Piping launchctl straight into `grep -q`
            # races SIGPIPE under pipefail; smoke-ios-simulator.sh records the
            # run that taught this.
            local process_list
            process_list="$(xcrun simctl spawn "$MAESTRO_DEVICE" launchctl list)"
            grep -q "com.kangentic.mobile" <<< "$process_list"
          }
          # THE PROCESS TABLE IS THE VERDICT, NOT THE CRASH REPORT. Run
          # 34672597979 tapped the JS row, the app died (a screenshot of the
          # bare home screen, and the handled canary sent seconds earlier
          # arrived in Sentry), and ~/Library/Logs/DiagnosticReports still
          # held no .ips 25 s later. Whatever this runner image does with
          # simulator crash reports, it is not prompt, so the reports are
          # collected afterwards as a bonus and the gate is "the app is gone".
          assert_app_died() {
            if app_is_running; then
              echo "::error::com.kangentic.mobile is still running after $1, so the tap did not crash it. Read the flow's debug output in the ios-probe-evidence artifact."
              exit 1
            fi
            echo "com.kangentic.mobile is no longer running after $1: the crash happened."
          }
          relaunch_and_flush() {
            xcrun simctl launch "$MAESTRO_DEVICE" com.kangentic.mobile
            sleep 25
          }
          run_flow() {
            maestro --device "$MAESTRO_DEVICE" test "$1" \
              --format JUNIT --output "$EVIDENCE/$2.xml" \
              --debug-output "$EVIDENCE/$2-debug" --flatten-debug-output \
              || echo "::warning::$1 did not exit cleanly; deciding on the process table instead."
            sleep 5
          }

          maestro --version
          run_flow .maestro/probes/crash-test-js.yaml js
          assert_app_died "the JS throw"
          relaunch_and_flush

          run_flow .maestro/probes/crash-test-native.yaml native
          assert_app_died "the native crash"
          relaunch_and_flush

          report_count="$(crash_reports | wc -l | tr -d ' ')"
          if [ "$report_count" -eq 0 ]; then
            echo "::warning::No .ips crash report appeared in ~/Library/Logs/DiagnosticReports. The crashes happened (the process was gone both times); this runner image does not write simulator crash reports there promptly, if at all."
          else
            echo "Crash reports on disk: $report_count."
          fi
          echo "Two deliberate crashes recorded and the app relaunched after each. Sentry should now hold two iOS events under environment crash-test."

      # Always collected, even when the step above failed: the crash reports,
      # the unified log and the Maestro debug output are what turn a silent
      # non-delivery into a diagnosable one.
      - name: Collect the crash evidence
        if: always() && env.CRASH_TEST == 'true'
        env:
          MAESTRO_DEVICE: ${{ steps.smoke.outputs.device-id }}
          EVIDENCE: ${{ runner.temp }}/crash-evidence
          SCHEME: ${{ steps.xcode.outputs.scheme }}
        run: |
          set -uo pipefail
          mkdir -p "$EVIDENCE"
          if [ -f "$EVIDENCE/run-start.marker" ]; then
            find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 1 -name '*.ips' -newer "$EVIDENCE/run-start.marker" -print0 2>/dev/null \
              | xargs -0 grep -l 'com.kangentic.mobile' 2>/dev/null \
              | while IFS= read -r report; do cp "$report" "$EVIDENCE/"; done
          fi
          echo "Crash reports collected: $(find "$EVIDENCE" -maxdepth 1 -name '*.ips' | wc -l | tr -d ' ')"
          # sentry-cocoa logs through NSLog under the APP's process when
          # `debug: true` (which the crash-test flag turns on), with a
          # `[Sentry]` prefix. BEST EFFORT, AND SO FAR EMPTY: two runs of
          # `simctl spawn <sim> log show` returned the simulator's own daemons
          # regardless of the predicate and none of the app's lines, and one
          # run of the host's `log show` with this image-path predicate returned
          # nothing at all (run 34674085719). Neither route has yet captured
          # the app's lines, and the probe's verdict never depended on them:
          # the crash is the process table, the delivery is the Sentry read.
          # Counted on the `[Sentry]` prefix, because a plain case-insensitive
          # "sentry" matched 89 lines of `AssetsEntry` in a CoreData dump.
          log show --last 30m --style compact \
            --predicate "processImagePath CONTAINS \"$SCHEME.app\"" \
            > "$EVIDENCE/unified-log.txt" 2>&1 || true
          echo "Unified-log lines from the app: $(wc -l < "$EVIDENCE/unified-log.txt" | tr -d ' '), with the [Sentry] prefix: $(grep -c '\[Sentry\]' "$EVIDENCE/unified-log.txt" || true)"
          xcrun simctl io "$MAESTRO_DEVICE" screenshot "$EVIDENCE/final.png" || true

      # THE NSE PROBE'S MOST UNCERTAIN ASSUMPTION, checked before a simulator
      # minute is spent on the probe and AFTER the crash flows, so a wrong
      # assumption here can never cost the crash evidence when both probes
      # ride one dispatch. The extension reads the push key through its
      # `keychain-access-groups` entitlement (SharedKeychain.swift sets no
      # group on the query), and the app writes with the group the bundle
      # inlined. Both entitlements files spell it `$(AppIdentifierPrefix)` +
      # `com.kangentic.mobile.shared`; on an ad-hoc simulator build with no
      # team, Xcode substitutes `FAKETEAMID.` for the prefix (observed on run
      # 34674085719, which this check caught: the app had been built with the
      # bare group). So: read the entitlements out of BOTH signed bundles, print
      # them (safe: this job installs no signing material, so no real team id
      # can appear), and fail naming the observed value when it is not the
      # literal the app was built with.
      - name: Verify the shared Keychain group the simulator bundles carry
        if: env.NSE_PROBE == 'true'
        env:
          APP_PATH: ${{ steps.verify.outputs.app-path }}
        run: |
          set -euo pipefail
          expected_group="$EXPO_PUBLIC_KANGENTIC_IOS_KEYCHAIN_GROUP"
          for bundle in "$APP_PATH" "$APP_PATH/PlugIns/KangenticNSE.appex"; do
            echo "::group::Entitlements of $(basename "$bundle")"
            entitlements="$(codesign -d --entitlements - --xml "$bundle" 2>/dev/null || codesign -d --entitlements :- "$bundle" 2>/dev/null || true)"
            echo "$entitlements"
            echo "::endgroup::"
            if [ -z "$entitlements" ]; then
              echo "::error::$(basename "$bundle") carries no readable entitlements. The ad-hoc signing did not embed any, so the app and the extension cannot share a Keychain group."
              exit 1
            fi
            if ! echo "$entitlements" | grep -q "<string>$expected_group</string>"; then
              echo "::error::$(basename "$bundle") does not carry the Keychain group the app was built to write to ($expected_group). Read the group it DOES carry above and correct the literal in 'Export the NSE probe env'."
              exit 1
            fi
          done
          echo "Both bundles carry keychain-access-group $expected_group."

      # THE NSE PROBE. Seeds known push vectors into the shared Keychain from
      # Settings (through the production write path), seals a push with the
      # same vectors on the runner, pushes it to the TERMINATED app (a
      # notification for a terminated app is rendered by SpringBoard with no
      # foreground-presentation question; the app sets no notification
      # handler), and reads back what the OS displayed through the app. The
      # read flow is the verdict; banner.png is the human evidence; the
      # extension's lines in the unified log separate "never ran" from "ran and
      # fell back to the placeholder", which is the distinction
      # docs/developer-guide.md says a delivered notification alone cannot make.
      # Runs after the crash probe when both are dispatched, so a failure here
      # never costs the crash evidence.
      - name: Run the NSE probe
        if: env.NSE_PROBE == 'true'
        timeout-minutes: 20
        env:
          MAESTRO_DEVICE: ${{ steps.smoke.outputs.device-id }}
          EVIDENCE: ${{ runner.temp }}/nse-probe
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          maestro --version
          maestro --device "$MAESTRO_DEVICE" test .maestro/probes/nse-seed.yaml \
            --format JUNIT --output "$EVIDENCE/seed.xml" \
            --debug-output "$EVIDENCE/seed-debug" --flatten-debug-output
          # Sealed immediately before the push: the envelope's sentAt is the
          # moment of sealing and the extension enforces a freshness window.
          node scripts/sealNseProbePush.mjs --out "$EVIDENCE/payload.json"
          xcrun simctl terminate "$MAESTRO_DEVICE" com.kangentic.mobile || true
          sleep 2
          xcrun simctl push "$MAESTRO_DEVICE" com.kangentic.mobile "$EVIDENCE/payload.json"
          sleep 4
          xcrun simctl io "$MAESTRO_DEVICE" screenshot "$EVIDENCE/banner.png" || true
          # The HOST's unified log, for the same reason as the crash evidence
          # step: `simctl spawn <sim> log show` ignores the predicate.
          log show --last 5m --style compact \
            --predicate "processImagePath CONTAINS \"KangenticNSE\" OR (subsystem == \"com.apple.usernotifications\" AND eventMessage CONTAINS[c] \"kangentic\")" \
            > "$EVIDENCE/unified-log.txt" 2>&1 || true
          echo "Unified-log lines from the extension process: $(grep -c KangenticNSE "$EVIDENCE/unified-log.txt" || true)"
          # The mechanical verdict: the app reads back what the OS displayed.
          if ! maestro --device "$MAESTRO_DEVICE" test .maestro/probes/nse-read.yaml \
            --format JUNIT --output "$EVIDENCE/read.xml" \
            --debug-output "$EVIDENCE/read-debug" --flatten-debug-output; then
            echo "::error::The delivered title is not the extension's. Read banner.png: the placeholder means the extension did not run or could not read the shared group (see unified-log.txt for KangenticNSE lines); nothing means the push was never rendered (permission). The read flow's failure screenshot shows what the app read back."
            exit 1
          fi
          echo "The Notification Service Extension decrypted the probe push on the simulator."

      - name: Upload the probe evidence
        if: always() && (env.CRASH_TEST == 'true' || env.NSE_PROBE == 'true')
        uses: actions/upload-artifact@v7
        with:
          name: ios-probe-evidence-${{ github.sha }}
          path: |
            ${{ runner.temp }}/crash-evidence
            ${{ runner.temp }}/nse-probe
          retention-days: 14
          if-no-files-found: warn
          # Maestro writes its debug output under a dot directory, which
          # upload-artifact skips by default - the screenshot artifact learned
          # this by uploading empty.
          include-hidden-files: true

      - name: Upload the Maestro output
        if: always() && inputs.maestro != 'none'
        uses: actions/upload-artifact@v7
        with:
          name: maestro-ios-${{ github.sha }}
          path: |
            ${{ runner.temp }}/maestro-ios-report.xml
            ${{ runner.temp }}/maestro-ios-debug
          retention-days: 14
          if-no-files-found: warn

      # Uploaded even on failure: a screenshot of a blank or red screen is the
      # single most useful artifact when a launch goes wrong, and a process can be
      # alive while rendering nothing at all.
      - name: Upload the launch screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-simulator-launch-${{ github.sha }}
          path: ${{ runner.temp }}/launch.png
          retention-days: 14
          if-no-files-found: warn

      - name: Write the build summary
        if: always()
        env:
          SCHEME: ${{ steps.xcode.outputs.scheme }}
          RELEASE_VERSION: ${{ steps.version.outputs.version-name }}
          RELEASE_BUILD: ${{ steps.version.outputs.build-number }}
        run: |
          {
            echo "### iOS simulator build and launch"
            echo ""
            echo "App scheme: \`${SCHEME:-unresolved}\`"
            echo ""
            if [ "${CRASH_TEST:-}" = "true" ]; then
              echo "**Crash-test probe.** An ad-hoc-signed Release simulator build carrying the DSN and"
              echo "\`EXPO_PUBLIC_KANGENTIC_CRASHTEST=1\`. Two deliberate crashes were driven from Settings and"
              echo "the app was relaunched after each, so Sentry should hold two iOS events under environment"
              echo "\`crash-test\` for release \`com.kangentic.mobile@${RELEASE_VERSION:-?}+${RELEASE_BUILD:-?}\`."
              echo "Evidence (crash reports, unified log, Maestro output) is in the \`ios-probe-evidence-*\`"
              echo "artifact. Verify from the desk with the recipe in the crash reporting section of"
              echo "docs/developer-guide.md."
            fi
            if [ "${NSE_PROBE:-}" = "true" ]; then
              echo ""
              echo "**NSE probe.** Known push vectors seeded from Settings, a sealed push delivered with"
              echo "\`simctl push\`, and the delivered title read back through the app. The read flow's"
              echo "result is the verdict; \`banner.png\` and the extension's unified-log lines are in the"
              echo "\`ios-probe-evidence-*\` artifact."
            fi
            if [ "${CRASH_TEST:-}" != "true" ] && [ "${NSE_PROBE:-}" != "true" ]; then
              echo "Unsigned simulator build, so it is not installable on a device and not a"
              echo "distribution artifact. It IS launched on a simulator, and the run's"
              echo "\`ios-simulator-launch-*\` artifact holds a screenshot of what rendered."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  device:
    name: Device (signed .ipa)
    if: github.event_name != 'schedule' && inputs.target != 'simulator'
    runs-on: macos-latest
    timeout-minutes: 90
    outputs:
      artifact-name: ${{ steps.name.outputs.artifact-name }}
      bundle-id: ${{ steps.signing.outputs.bundle-id }}
      build-number: ${{ steps.version.outputs.build-number }}
      # Exposed for the spent-build-number tag in submit-testflight. The step
      # already computed it for the ASC preflight; it just was not published.
      version-name: ${{ steps.version.outputs.version-name }}
    env:
      # Secrets cannot be referenced from an `if:` condition, so presence is
      # resolved once here as a plain boolean and the steps branch on that.
      # IOS_NSE_PROVISIONING_PROFILE_BASE64 is required, not optional: the app
      # now ships a Notification Service Extension, and an extension target with
      # no profile fails the archive. Failing here names the missing secret;
      # failing in xcodebuild does not.
      HAS_SIGNING: ${{ secrets.IOS_DIST_CERT_BASE64 != '' && secrets.IOS_PROVISIONING_PROFILE_BASE64 != '' && secrets.IOS_NSE_PROVISIONING_PROFILE_BASE64 != '' }}
      # Two upload auth paths, deliberately. An App Store Connect API key is the
      # better one, but minting it requires App Store Connect's Users and Access
      # page to be up, and that is exactly the surface that fails during an ASC
      # incident. An app-specific password comes from appleid.apple.com, a
      # different service, so it stays available when ASC does not.
      HAS_ASC_API_KEY: ${{ secrets.ASC_API_KEY_BASE64 != '' && secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' }}
      # DSN is a repository VARIABLE, not a secret: it ships in the public app
      # bundle, and a variable can be read back to confirm which project a
      # build reports to. Same rationale as build-android.yml.
      HAS_SENTRY: ${{ secrets.SENTRY_AUTH_TOKEN != '' && vars.SENTRY_DSN != '' }}

    steps:
      # The simulator job's copy of the same refusal, so it is unconditional
      # across `target` values. This job does not otherwise honour either
      # probe flag: a distribution-signed probe .ipa would be installable only
      # through TestFlight, which the refusal makes impossible, so it would be
      # a 30-minute artifact nobody can run. The simulator job is where the
      # probes live.
      - name: Refuse a probe build that is also a store submission
        if: (inputs.crash_test == true || inputs.nse_probe == true) && inputs.submit == 'testflight'
        run: |
          set -euo pipefail
          echo "::error::crash_test / nse_probe and submit=testflight are mutually exclusive. A probe build reveals Settings rows that crash the app or seed known Keychain keys, so it must never be uploaded to App Store Connect. Dispatch them as separate runs."
          exit 1

      - uses: actions/checkout@v7

      # Fails immediately rather than degrading. The Android job can fall back
      # to a debug-signed APK because that is still installable and still proves
      # the toolchain; there is no equivalent useful unsigned iOS artifact, and
      # the simulator job above already covers "does it compile".
      - name: Require signing material
        if: env.HAS_SIGNING != 'true'
        run: |
          echo "::error::A device build needs IOS_DIST_CERT_BASE64, IOS_DIST_CERT_PASSWORD, IOS_PROVISIONING_PROFILE_BASE64"
          echo "::error::and IOS_NSE_PROVISIONING_PROFILE_BASE64 (the Notification Service Extension's own profile, for"
          echo "::error::the com.kangentic.mobile.nse App ID; both App IDs also need the Keychain Sharing group"
          echo "::error::com.kangentic.mobile.shared)."
          echo "::error::See the credential inventory in docs/developer-guide.md. Dispatch with target=simulator for an unsigned check."
          exit 1

      - name: Set up Node and dependencies
        uses: ./.github/actions/setup-node-deps

      - name: Install the signing certificate and provisioning profile
        id: signing
        env:
          IOS_DIST_CERT_BASE64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          # The Notification Service Extension's own profile. An app extension is
          # a separate bundle id (com.kangentic.mobile.nse) and cannot share the
          # app's. Both App IDs must also carry the shared Keychain Sharing
          # group; install-ios-signing.sh fails loudly if either does not,
          # because the runtime symptom is a silent placeholder.
          IOS_NSE_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_NSE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$IOS_DIST_CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/dist-cert.p12"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          if [ -n "$IOS_NSE_PROVISIONING_PROFILE_BASE64" ]; then
            printf '%s' "$IOS_NSE_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/nse-profile.mobileprovision"
          fi
          bash .github/scripts/install-ios-signing.sh \
            "$RUNNER_TEMP/dist-cert.p12" \
            "$IOS_DIST_CERT_PASSWORD" \
            "$RUNNER_TEMP/profile.mobileprovision" \
            "${IOS_NSE_PROVISIONING_PROFILE_BASE64:+$RUNNER_TEMP/nse-profile.mobileprovision}"

      # eas.json stays the source of truth for per-profile env on BOTH platforms.
      # Without this, an EXPO_PUBLIC_* value added to a profile would reach an
      # Android build and silently not reach an iOS one, which is the kind of
      # divergence nobody notices until a feature flag is mysteriously off on one
      # platform. iOS has no profile input yet (see the parity notes in
      # docs/developer-guide.md), so it takes production's env, which is what a
      # signed distribution build should carry.
      - name: Export the profile env from eas.json
        run: node scripts/easProfile.mjs production --github-env

      # plugins/withIosManualSigning.ts reads these and applies manual signing to
      # the app target only. It MUST run before prebuild, not merely before the
      # archive: a config plugin executes during prebuild, and GITHUB_ENV only
      # affects later steps, so exporting late leaves the generated project on
      # automatic signing and the archive fails with no obvious cause. Same trap
      # as the eas.json env export in build-android.yml, which a test locks.
      - name: Export the signing inputs for the config plugin
        env:
          TEAM_ID: ${{ steps.signing.outputs.team-id }}
          PROFILE_UUID: ${{ steps.signing.outputs.profile-uuid }}
          SIGNING_IDENTITY: ${{ steps.signing.outputs.signing-identity }}
          NSE_PROFILE_UUID: ${{ steps.signing.outputs.nse-profile-uuid }}
          KEYCHAIN_ACCESS_GROUP: ${{ steps.signing.outputs.keychain-access-group }}
        run: |
          set -euo pipefail
          {
            echo "KANGENTIC_IOS_TEAM_ID=$TEAM_ID"
            echo "KANGENTIC_IOS_PROFILE_UUID=$PROFILE_UUID"
            echo "KANGENTIC_IOS_SIGNING_IDENTITY=$SIGNING_IDENTITY"
            echo "KANGENTIC_IOS_NSE_PROFILE_UUID=$NSE_PROFILE_UUID"
            # Read at BUNDLE time by src/notifications/sharedKeychain.ts, not at
            # prebuild time like the three above. kSecAttrAccessGroup needs the
            # team-prefixed literal and the team id must not be committed
            # (no-personal-info.md), so it is composed here from the
            # profile-derived team id and inlined by Metro.
            echo "EXPO_PUBLIC_KANGENTIC_IOS_KEYCHAIN_GROUP=$KEYCHAIN_ACCESS_GROUP"
          } >> "$GITHUB_ENV"

      # Same pre-prebuild requirement, and the same reason it is a secret
      # rather than an eas.json entry, as build-android.yml: app.config.ts
      # reads SENTRY_AUTH_TOKEN at config-evaluation time to decide whether
      # to add the Sentry plugin, and a DSN committed to a public repo would
      # route every fork's crashes into this project's free-tier quota.
      - name: Export the Sentry build env
        if: env.HAS_SENTRY == 'true'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_DSN: ${{ vars.SENTRY_DSN }}
        run: |
          set -euo pipefail
          # Token masked (it can upload releases); DSN deliberately not, since
          # it ships in the published bundle and a legible value makes this log
          # answer "which project did this build report to?".
          echo "::add-mask::$SENTRY_AUTH_TOKEN"
          {
            echo "SENTRY_AUTH_TOKEN=$SENTRY_AUTH_TOKEN"
            echo "EXPO_PUBLIC_SENTRY_DSN=$SENTRY_DSN"
          } >> "$GITHUB_ENV"
          echo "Sentry is enabled for this build: dSYMs and source maps upload, crash reporting is active."
          echo "Reporting to: $SENTRY_DSN"

      - name: Note when Sentry is not configured
        if: env.HAS_SENTRY != 'true'
        run: echo "::notice::SENTRY_AUTH_TOKEN/SENTRY_DSN are not both set. This build ships with crash reporting inert and uploads no symbols."

      - name: Generate the native iOS project
        run: npx expo prebuild --platform ios --no-install

      # Keyed on the Podfile.lock that prebuild just generated, so the cache is
      # only reused when the resolved pod set is byte-identical. pod install on
      # an Expo project is minutes of downloads.
      - name: Cache CocoaPods
        uses: actions/cache@v6
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: ${{ runner.os }}-pods-

      - name: Install pods
        working-directory: ios
        run: pod install

      - name: Resolve the workspace and scheme
        id: xcode
        run: bash .github/scripts/resolve-ios-scheme.sh

      - name: Read the app version
        id: version
        run: |
          set -euo pipefail
          npx expo config --json > "$RUNNER_TEMP/expo-config.json"
          read_config_field() {
            node -e "const c=JSON.parse(require('node:fs').readFileSync(process.argv[1],'utf8'));process.stdout.write(String($1))" "$RUNNER_TEMP/expo-config.json"
          }
          echo "version-name=$(read_config_field 'c.version')" >> "$GITHUB_OUTPUT"
          echo "build-number=$(read_config_field 'c.ios.buildNumber')" >> "$GITHUB_OUTPUT"

      # Runs before the archive so a duplicate build number costs seconds rather
      # than a 30 minute build followed by an App Store Connect rejection. This
      # is the iOS half of the lesson scripts/checkPlayVersionCode.mjs encodes.
      - name: Check the build number is free on App Store Connect
        if: env.HAS_ASC_API_KEY == 'true'
        env:
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          BUNDLE_ID: ${{ steps.signing.outputs.bundle-id }}
          VERSION_NAME: ${{ steps.version.outputs.version-name }}
          BUILD_NUMBER: ${{ steps.version.outputs.build-number }}
        run: |
          set -euo pipefail
          printf '%s' "$ASC_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/asc-api-key.p8"
          node scripts/checkAppStoreBuild.mjs \
            --key "$RUNNER_TEMP/asc-api-key.p8" \
            --key-id "$ASC_KEY_ID" \
            --issuer-id "$ASC_ISSUER_ID" \
            --bundle-id "$BUNDLE_ID" \
            --version "$VERSION_NAME" \
            --build-number "$BUILD_NUMBER"

      - name: Warn when the build number cannot be preflighted
        if: env.HAS_ASC_API_KEY != 'true'
        run: echo "::warning::No App Store Connect API key, so ios.buildNumber was not checked against existing builds. A duplicate will be rejected at upload."

      # Guard: the config plugin is inert without its environment variables, and a
      # silently unsigned archive is exactly the failure this whole workflow is
      # built to avoid. Cheap to assert, and it names the cause.
      - name: Verify the app target carries manual signing
        env:
          SCHEME: ${{ steps.xcode.outputs.scheme }}
          PROFILE_UUID: ${{ steps.signing.outputs.profile-uuid }}
        run: |
          set -euo pipefail
          settings_path="$RUNNER_TEMP/app-target-settings.txt"
          xcodebuild -showBuildSettings \
            -workspace "ios/$SCHEME.xcworkspace" \
            -scheme "$SCHEME" \
            -configuration Release > "$settings_path"

          if ! grep -q "PROVISIONING_PROFILE_SPECIFIER = $PROFILE_UUID" "$settings_path"; then
            echo "::error::The app target is not set to the installed provisioning profile."
            echo "::error::plugins/withIosManualSigning.ts did not apply. Its KANGENTIC_IOS_* variables must be exported BEFORE prebuild."
            grep -E "CODE_SIGN_STYLE|PROVISIONING_PROFILE_SPECIFIER|DEVELOPMENT_TEAM" "$settings_path" || true
            exit 1
          fi
          if ! grep -q "CODE_SIGN_STYLE = Manual" "$settings_path"; then
            echo "::error::The app target is still on automatic signing."
            exit 1
          fi
          echo "App target is on manual signing with the installed profile."

          # The extension target, checked separately. It is created by
          # withIosNotificationServiceExtension and signed by
          # withIosManualSigning, which run in that order during prebuild; if
          # the order ever reverses, the signing plugin finds no target by that
          # name and writes nothing, and the archive fails with a message that
          # names neither plugin.
          #
          # READ THE PBXPROJ, NOT xcodebuild. The first version of this check ran
          # `xcodebuild -showBuildSettings -workspace ... -scheme ... -target
          # KangenticNSE`, and `-target` is not valid with `-workspace` (it pairs
          # with `-project`). Worse, it sent that error to /dev/null under
          # `|| true`, so the settings file came back EMPTY, the grep below found
          # nothing, and the step failed every signed build while blaming a plugin
          # order that was correct all along. It also had never run before: no
          # target=device build was dispatched between the extension landing and
          # the v0.6.3 release, so the bug shipped green through every simulator
          # build. Grepping the generated project is direct evidence that the
          # plugin wrote the setting, needs no scheme or workspace resolution, and
          # cannot fail for flag reasons.
          #
          # The UUID is unique to the extension (an app extension has its own
          # bundle id and therefore its own profile), so finding it at all proves
          # it was written to the extension target and not the app's.
          if [ -n "${KANGENTIC_IOS_NSE_PROFILE_UUID:-}" ]; then
            pbxproj_path="ios/$SCHEME.xcodeproj/project.pbxproj"
            if [ ! -f "$pbxproj_path" ]; then
              echo "::error::No generated Xcode project at $pbxproj_path, so the extension's signing cannot be verified."
              exit 1
            fi

            if ! grep -q "PROVISIONING_PROFILE_SPECIFIER = \"$KANGENTIC_IOS_NSE_PROFILE_UUID\"" "$pbxproj_path"; then
              echo "::error::The Notification Service Extension target is not set to its provisioning profile."
              echo "::error::plugins/withIosManualSigning.ts writes it only when a target named KangenticNSE already exists, so check that withIosNotificationServiceExtension created one and still runs BEFORE it in app.config.ts."
              grep -E "PROVISIONING_PROFILE_SPECIFIER|PRODUCT_NAME = \"?KangenticNSE" "$pbxproj_path" || true
              exit 1
            fi
            echo "Extension target is on manual signing with its own profile."
          fi

      # Its own step rather than an append to the signing guard above: the two
      # fail for unrelated reasons and are fixed in different places (missing
      # KANGENTIC_IOS_* variables vs. a build-setting override), and the Actions
      # UI shows only the step name, not the log line that failed.
      #
      # iOS has no R8 counterpart - it ships compiled machine code, and the
      # Release configuration's LLVM optimizer and linker dead-stripping have
      # already run. What it DOES share with the Android side of this workflow
      # pair is the symbol upload that keeps native frames readable: dSYMs here,
      # mapping.txt there.
      #
      # The Sentry plugin's Xcode upload phase is asserted to EXIST by ci.yml,
      # but nothing asserted the archive actually feeds it. Release defaults to
      # dwarf-with-dsym and the Expo template does not override it, so this held
      # by default rather than by check until this step existed - and an upload
      # phase with no dSYMs to upload fails silently, leaving every native iOS
      # frame unsymbolicated with every gate green.
      #
      # Reuses the settings dump the signing step already wrote, so this costs
      # a grep rather than a second xcodebuild invocation.
      - name: Verify the Release configuration emits dSYMs
        run: |
          set -euo pipefail
          settings_path="$RUNNER_TEMP/app-target-settings.txt"
          if ! grep -q "DEBUG_INFORMATION_FORMAT = dwarf-with-dsym" "$settings_path"; then
            echo "::error::The Release configuration does not emit dSYMs, so the Sentry upload phase has nothing to upload and every native iOS crash would arrive unsymbolicated."
            grep -E "DEBUG_INFORMATION_FORMAT|STRIP_INSTALLED_PRODUCT" "$settings_path" || true
            exit 1
          fi
          echo "Release configuration emits dSYMs for the Sentry upload phase."

      - name: Archive the app (xcodebuild)
        env:
          WORKSPACE: ${{ steps.xcode.outputs.workspace }}
          SCHEME: ${{ steps.xcode.outputs.scheme }}
          KEYCHAIN_PATH: ${{ steps.signing.outputs.keychain-path }}
        run: |
          set -euo pipefail

          # Signed here rather than only at export time. Exporting an unsigned
          # archive is the usual way to dodge the "target does not support
          # provisioning profiles" error these command-line settings can cause
          # on Pods targets, but an unsigned archive carries no
          # archived-expanded-entitlements.xcent, so the re-sign at export can
          # silently drop custom entitlements. This app needs
          # aps-environment=production for push, and losing it produces a build
          # that installs, launches, and never receives a notification. A loud
          # archive failure is a far better trade than a silent one, and
          # verify-ios-signature.sh checks the entitlement either way.
          #
          # No signing settings on the command line. They would apply to every
          # target in the workspace, and a target that produces no signed bundle
          # rejects a provisioning profile outright. The first attempt failed
          # exactly there, on a Swift Package target:
          #
          #   RaTeX_RaTeX does not support provisioning profiles, but
          #   provisioning profile <uuid> has been manually specified.
          #
          # plugins/withIosManualSigning.ts now writes the four properties into
          # the app target's build settings during prebuild instead. Exempting
          # each offending target by name would be whack-a-mole: the dependency
          # graph decides how many exist.
          #
          # OTHER_CODE_SIGN_FLAGS stays here because pointing codesign at the
          # throwaway keychain is harmless for targets that never sign.
          #
          # If a "does not support provisioning profiles" error returns, the
          # cause is a target the plugin did not cover. The Notification Service
          # Extension has since landed and is handled: withIosManualSigning
          # signs its target from KANGENTIC_IOS_NSE_PROFILE_UUID, and
          # .github/scripts/export-ios-ipa.sh carries its bundle id in the
          # provisioningProfiles dict. A NEW target would need the same two
          # additions. Do not "fix" it by archiving unsigned: an unsigned
          # archive can silently lose aps-environment at export, which ships an
          # app that never receives a push.
          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/$SCHEME.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH"

      - name: Export the .ipa
        id: export
        env:
          SCHEME: ${{ steps.xcode.outputs.scheme }}
          TEAM_ID: ${{ steps.signing.outputs.team-id }}
          PROFILE_UUID: ${{ steps.signing.outputs.profile-uuid }}
          BUNDLE_ID: ${{ steps.signing.outputs.bundle-id }}
          SIGNING_IDENTITY: ${{ steps.signing.outputs.signing-identity }}
          # Every embedded bundle needs its own provisioningProfiles entry, or
          # -exportArchive fails on the extension.
          NSE_BUNDLE_ID: ${{ steps.signing.outputs.nse-bundle-id }}
          NSE_PROFILE_UUID: ${{ steps.signing.outputs.nse-profile-uuid }}
        run: bash .github/scripts/export-ios-ipa.sh

      # An .ipa that is unsigned, development-signed, or missing the push
      # entitlement is indistinguishable from a good one until Apple rejects it
      # or a tester reports silence. Checked here, before the upload.
      - name: Verify the .ipa is distribution signed
        env:
          IPA_PATH: ${{ steps.export.outputs.ipa-path }}
          BUNDLE_ID: ${{ steps.signing.outputs.bundle-id }}
        run: bash .github/scripts/verify-ios-signature.sh "$IPA_PATH" "$BUNDLE_ID"

      - name: Name the artifact
        id: name
        env:
          IPA_PATH: ${{ steps.export.outputs.ipa-path }}
          VERSION_NAME: ${{ steps.version.outputs.version-name }}
          BUILD_NUMBER: ${{ steps.version.outputs.build-number }}
        run: |
          set -euo pipefail
          artifact_name="kangentic-ios-v$VERSION_NAME-b$BUILD_NUMBER-${GITHUB_SHA::7}"
          cp "$IPA_PATH" "$RUNNER_TEMP/$artifact_name.ipa"
          echo "artifact-name=$artifact_name" >> "$GITHUB_OUTPUT"

      # The .ipa is stored before anything tries to upload it, so an Apple-side
      # failure leaves a verified artifact that can be retried by re-running the
      # submit job alone. That is not a hypothetical: the first attempt to submit
      # this app hit an App Store Connect outage.
      - name: Upload the .ipa as a run artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.name.outputs.artifact-name }}
          path: ${{ runner.temp }}/${{ steps.name.outputs.artifact-name }}.ipa
          retention-days: 14
          if-no-files-found: error

      - name: Write the build summary
        if: always()
        env:
          ARTIFACT_NAME: ${{ steps.name.outputs.artifact-name }}
          VERSION_NAME: ${{ steps.version.outputs.version-name }}
          BUILD_NUMBER: ${{ steps.version.outputs.build-number }}
          BUNDLE_ID: ${{ steps.signing.outputs.bundle-id }}
          SUBMIT: ${{ inputs.submit }}
        run: |
          {
            echo "### iOS device build"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Artifact | \`${ARTIFACT_NAME:-none}\` |"
            echo "| Bundle id | \`${BUNDLE_ID:-unresolved}\` |"
            echo "| Version | \`${VERSION_NAME:-?}\` (build \`${BUILD_NUMBER:-?}\`) |"
            echo "| Requested upload | \`$SUBMIT\` |"
            echo ""
            echo "Bump \`ios.buildNumber\` in \`app.config.ts\` before every App Store Connect upload."
          } >> "$GITHUB_STEP_SUMMARY"

  # Its own job, behind the app-store-connect GitHub Environment's required
  # reviewer, for the same reasons as build-android.yml's submit-play job: an
  # upload reaches people outside this machine, and it should take a deliberate
  # human approval rather than a dispatch input alone.
  #
  # Splitting it also makes an Apple outage cheap. Re-running this one job
  # retries the upload against the already-verified .ipa, with no rebuild and no
  # new build number. That is exactly the situation this workflow was written in.
  #
  # macOS because `xcrun altool` is the uploader. It re-verifies what it
  # downloaded rather than trusting the build job, which is both stronger and
  # what caught a bad Android artifact twice.
  submit-testflight:
    name: Submit (TestFlight)
    needs: device
    # `inputs.crash_test != true` is belt-and-braces to the refusal step at the
    # top of both build jobs, mirroring submit-play on Android: a probe build
    # must not reach App Store Connect even if that step were ever removed.
    if: github.event_name != 'schedule' && inputs.submit == 'testflight' && inputs.crash_test != true && inputs.nse_probe != true
    runs-on: macos-latest
    timeout-minutes: 60
    environment: app-store-connect
    # The workflow is `contents: read` at the top level. Raised for THIS job
    # only, so the spent-build-number tag step can create a ref. The archive
    # job stays read-only.
    permissions:
      contents: write
    env:
      # Declared HERE and not only on the `device` job. `env` does not cross a job
      # boundary, and the first version of this workflow assumed it did: the
      # "Wait for Apple to accept the build" step is gated on this, so it silently
      # SKIPPED on every run while the job still reported success. That is the
      # precise failure this whole job exists to prevent, reintroduced one level up
      # by a scoping mistake. tests/unit/buildWorkflow.test.ts now checks that every
      # job gating a step on an env boolean also defines it.
      HAS_ASC_API_KEY: ${{ secrets.ASC_API_KEY_BASE64 != '' && secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Download the verified .ipa from the build job
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.device.outputs.artifact-name }}
          path: artifact

      - name: Verify the .ipa is distribution signed
        env:
          BUNDLE_ID: ${{ needs.device.outputs.bundle-id }}
        run: |
          set -euo pipefail
          ipa_path="$(find artifact -maxdepth 1 -name '*.ipa' | head -n 1)"
          if [ -z "$ipa_path" ]; then
            echo "::error::No .ipa in the downloaded artifact."
            exit 1
          fi
          echo "IPA_PATH=$ipa_path" >> "$GITHUB_ENV"
          bash .github/scripts/verify-ios-signature.sh "$ipa_path" "$BUNDLE_ID"

      - name: Upload to App Store Connect
        env:
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: bash .github/scripts/upload-ios-testflight.sh "$IPA_PATH"

      # An upload succeeding is NOT a build reaching TestFlight. Builds 1 and 2 were
      # both refused by Apple AFTER `UPLOAD SUCCEEDED`, with ITMS-90683 for a missing
      # purpose string, and the only notification was an email: altool reported
      # success, `--validate-app` had passed, and this job went green over a rejected
      # binary. This step closes that gap by waiting for the state Apple actually
      # lands on.
      #
      # Skipped without an ASC API key, since it needs the API to ask.
      - name: Wait for Apple to accept the build
        if: env.HAS_ASC_API_KEY == 'true'
        env:
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          BUNDLE_ID: ${{ needs.device.outputs.bundle-id }}
          BUILD_NUMBER: ${{ needs.device.outputs.build-number }}
        run: |
          set -euo pipefail
          printf '%s' "$ASC_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/asc-api-key.p8"
          node scripts/checkAppStoreBuild.mjs \
            --key "$RUNNER_TEMP/asc-api-key.p8" \
            --key-id "$ASC_KEY_ID" \
            --issuer-id "$ASC_ISSUER_ID" \
            --bundle-id "$BUNDLE_ID" \
            --build-number "$BUILD_NUMBER" \
            --await-processing 1 \
            --timeout-minutes 25

      - name: Warn that Apple's verdict was not checked
        if: env.HAS_ASC_API_KEY != 'true'
        run: echo "::warning::No App Store Connect API key, so Apple's processing verdict was not checked. An upload can still be rejected afterwards, by email only."

      # The durable record that this build number is now spent. See the matching
      # step in build-android.yml for the reasoning; the short version is that
      # this knowledge previously lived only in a hand-edited comment in
      # app.config.ts, and a stale one sent the 2026-07-28 release at a build
      # number Apple had already taken.
      #
      # Deliberately placed AFTER the accept-verdict step, so on a run with an
      # ASC key the tag means Apple accepted the build, not merely that altool
      # said UPLOAD SUCCEEDED. Builds 1 and 2 are exactly why that distinction
      # matters: both uploaded fine and were then refused.
      #
      # Never fails the job. The upload is already done and cannot be undone, so
      # a tagging problem is bookkeeping, not a release failure.
      - name: Record the spent build number as a tag
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_NUMBER: ${{ needs.device.outputs.build-number }}
          VERSION_NAME: ${{ needs.device.outputs.version-name }}
        run: |
          set -euo pipefail
          tag="ios-b${BUILD_NUMBER}"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists, leaving it alone."
            exit 0
          fi
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${tag}" \
            -f sha="${GITHUB_SHA}" >/dev/null
          echo "Tagged ${GITHUB_SHA} as ${tag} (v${VERSION_NAME})."

      - name: Write the submit summary
        if: always()
        env:
          BUNDLE_ID: ${{ needs.device.outputs.bundle-id }}
          BUILD_NUMBER: ${{ needs.device.outputs.build-number }}
        run: |
          {
            echo "### App Store Connect upload"
            echo ""
            echo "Uploaded \`$BUNDLE_ID\` build \`$BUILD_NUMBER\`."
            echo ""
            echo "It appears in TestFlight once Apple finishes processing, usually 5 to 30 minutes."
            echo "If this job failed, re-run it: the verified .ipa is attached to this run, so no rebuild is needed."
          } >> "$GITHUB_STEP_SUMMARY"
